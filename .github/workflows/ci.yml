name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  lint-installer:
    name: Lint Bash Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint install.sh
        run: shellcheck -S warning install.sh

      - name: Lint aidipanel CLI
        run: shellcheck -S warning aidipanel

      - name: Lint deploy-panel.sh
        run: shellcheck -S warning panel-app/deploy-panel.sh

      - name: Check bash syntax — install.sh
        run: bash -n install.sh

      - name: Check bash syntax — aidipanel
        run: bash -n aidipanel

      - name: Check bash syntax — deploy-panel.sh
        run: bash -n panel-app/deploy-panel.sh

      - name: Shell contract tests
        run: |
          for test in tests/unit/*.sh; do
            bash "$test"
          done

      - name: Python Docker contract tests
        run: python3 -B -m unittest discover -s tests/unit -p '*_test.py'

  lint-php:
    name: Lint PHP Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'

      - name: PHP syntax check (all files)
        run: find panel-app -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: PHP contract tests
        run: |
          for test in tests/unit/*.php; do
            php "$test"
          done

  frontend:
    name: Verify Frontend Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: panel-app/package-lock.json

      - name: Install locked dependencies
        working-directory: panel-app
        run: npm ci

      - name: Audit build and runtime dependencies
        working-directory: panel-app
        run: npm audit --audit-level=high

      - name: Rebuild frontend
        working-directory: panel-app
        run: npm run build

      - name: Frontend dependency contracts
        working-directory: panel-app
        run: npm test

      - name: Reject stale generated assets
        run: git diff --exit-code -- panel-app/public/assets

  release:
    name: Sign and Publish Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-installer, lint-php, frontend]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release version
        run: |
          source_version="${GITHUB_REF_NAME#v}"
          grep -Fqx "readonly PANEL_VERSION=\"${source_version}\"" install.sh
          grep -Fqx "readonly CLI_VERSION=\"${source_version}\"" aidipanel
          grep -Fqx "readonly PANEL_VERSION=\"${source_version}\"" panel-app/deploy-panel.sh
          # PANEL_VERSION the panel renders (footer) is defined here, separately.
          grep -Fqx "define('PANEL_VERSION', '${source_version}');" panel-app/public/index.php
          printf 'AIDIPANEL_RELEASE_VERSION=%s\n' "$source_version" >> "$GITHUB_ENV"

      - name: Package install script
        run: |
          cp install.sh install-aidipanel.sh
          tar -czf aidipanel-panel-app.tar.gz panel-app/
          {
            printf '# AIDIPANEL_RELEASE_VERSION=%s\n' "$AIDIPANEL_RELEASE_VERSION"
            sha256sum install-aidipanel.sh aidipanel aidipanel-panel-app.tar.gz
          } > SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aidipanel-dist
          path: |
            install-aidipanel.sh
            aidipanel
            aidipanel-panel-app.tar.gz
            SHA256SUMS
            config/release-signing-public.pub

      - name: Sign release manifest
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: bash tools/release/sign-manifest.sh SHA256SUMS config/release-signing-public.pub SHA256SUMS.sig

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)

          gh release create "$GITHUB_REF_NAME" "${flags[@]}" --draft

          gh release upload "$GITHUB_REF_NAME" \
            install-aidipanel.sh \
            aidipanel \
            aidipanel-panel-app.tar.gz \
            SHA256SUMS \
            SHA256SUMS.sig \
            config/release-signing-public.pub

      - name: Verify uploaded assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-check
          gh release download "$GITHUB_REF_NAME" --dir release-check
          for asset in install-aidipanel.sh aidipanel aidipanel-panel-app.tar.gz SHA256SUMS SHA256SUMS.sig; do
            cmp "$asset" "release-check/$asset"
          done
          cmp config/release-signing-public.pub release-check/release-signing-public.pub
          openssl dgst -sha256 -verify config/release-signing-public.pub -signature release-check/SHA256SUMS.sig release-check/SHA256SUMS
          (cd release-check && sha256sum -c SHA256SUMS)
          remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          [[ "$remote_commit" == "$GITHUB_SHA" ]] || { echo 'Release tag changed during the workflow.' >&2; exit 1; }
          gh release edit "$GITHUB_REF_NAME" --draft=false
